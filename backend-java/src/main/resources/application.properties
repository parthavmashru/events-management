# Server Configuration
server.port=5000
spring.application.name=college-event-platform-backend

# SQLite Database Configuration (relative path to root database/ directory)
app.database.path=../database/database.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration (safe development defaults; override via JVM args in production)
app.jwt.secret=college-event-management-dev-jwt-secret-key-2026
app.jwt.expiration-ms=172800000

# CORS Configuration
app.cors.allowed-origins=*

# Jackson Serialization
spring.jackson.serialization.write-dates-as-timestamps=false
